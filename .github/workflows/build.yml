name: Build Ultron APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Buildozer & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip3 install --upgrade pip buildozer cython virtualenv

      - name: Build Android Debug APK
        run: |
          yes | buildozer android debug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ultron-AI-APK
          path: bin/*.apk
